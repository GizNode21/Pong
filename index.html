<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pong 1972</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one cabinet — a bezel-framed CRT playfield centered, control card beneath. Single dark world by choice (a lit arcade screen). */
:root {
  --cabinet: #16130f;        /* woodgrain-dark cabinet surround */
  --bezel: #0a0a0a;
  --screen: #05070a;         /* unlit phosphor black, slight blue */
  --phosphor: #e8f1ff;       /* P4 white phosphor, cool bias */
  --glow: rgba(190, 215, 255, .55);
  --label: #b9a27a;          /* brass-plate lettering */
  --muted: #7d735f;
  --font-display: "Silkscreen", "Courier New", monospace;
  --font-body: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--cabinet);
  background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 7px);
  color: var(--label);
  font-family: var(--font-body);
  padding-inline: 16px;
  padding-block: 20px;
  box-sizing: border-box;
  display: flex; flex-direction: column; align-items: center; gap: 18px;
}
header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; justify-content: center; }
h1 {
  font-family: var(--font-display); font-weight: 700; margin: 0;
  font-size: clamp(28px, 5vw, 44px); letter-spacing: .12em; color: var(--phosphor);
  text-shadow: 0 0 12px var(--glow);
}
.plate { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.bezel {
  width: min(100%, 900px);
  background: var(--bezel);
  padding: clamp(8px, 2vw, 18px);
  border-radius: 22px;
  box-shadow: inset 0 0 0 2px #1d1b18, 0 20px 50px rgba(0,0,0,.6);
  box-sizing: border-box;
}
.screen {
  position: relative; aspect-ratio: 4 / 3; max-width: 100%;
  border-radius: 18px / 22px; overflow: hidden; background: var(--screen);
  box-shadow: inset 0 0 60px rgba(0,0,0,.9);
  touch-action: none;
}
canvas { display: block; width: 100%; height: 100%; filter: drop-shadow(0 0 4px var(--glow)); }
.screen::after { /* scanlines + vignette */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
}
.overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px; text-align: center; color: var(--phosphor); font-family: var(--font-display);
  text-shadow: 0 0 10px var(--glow); padding: 16px; box-sizing: border-box;
}
.overlay .big { font-size: clamp(20px, 4vw, 36px); letter-spacing: .1em; }
.overlay .small { font-size: clamp(11px, 1.6vw, 14px); letter-spacing: .12em; opacity: .85; }
.blink { animation: blink 1.1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
@media (prefers-reduced-motion: reduce) { .blink { animation: none; } }

.controls {
  width: min(100%, 900px); display: flex; flex-wrap: wrap; gap: 12px 24px;
  justify-content: space-between; align-items: center;
}
.modes { display: flex; gap: 8px; flex-wrap: wrap; }
button {
  font-family: var(--font-display); font-size: 13px; letter-spacing: .1em;
  background: transparent; color: var(--label); border: 1px solid #3a342a; border-radius: 4px;
  padding: 8px 14px; cursor: pointer;
}
button:hover { border-color: var(--label); }
button[aria-pressed="true"] { background: var(--label); color: var(--cabinet); border-color: var(--label); }
button:focus-visible { outline: 2px solid var(--phosphor); outline-offset: 2px; }
.keys { font-size: 12px; line-height: 1.7; color: var(--muted); display: flex; gap: 20px; flex-wrap: wrap; }
kbd {
  font-family: var(--font-body); font-size: 11px; color: var(--label);
  border: 1px solid #3a342a; border-bottom-width: 2px; border-radius: 3px; padding: 0 5px;
}
</style>
</head>
<body>

<header>
  <h1>PONG</h1>
  <span class="plate">Model 1972 · First to 11 wins</span>
</header>

<div class="bezel">
  <div class="screen" id="screen">
    <canvas id="c" width="800" height="600" aria-label="Pong playfield"></canvas>
    <div class="overlay" id="overlay">
      <div class="big" id="ovTitle">INSERT COIN</div>
      <div class="small blink" id="ovSub">PRESS SPACE OR TAP TO SERVE</div>
    </div>
  </div>
</div>

<div class="controls">
  <div class="modes" role="group" aria-label="Players">
    <button id="m1" aria-pressed="true">1 PLAYER</button>
    <button id="m2" aria-pressed="false">2 PLAYERS</button>
    <button id="snd" aria-pressed="true">SOUND ON</button>
  </div>
  <div class="keys">
    <span>Left: <kbd>W</kbd> <kbd>S</kbd></span>
    <span>Right: <kbd>↑</kbd> <kbd>↓</kbd></span>
    <span><kbd>Space</kbd> serve / pause</span>
    <span>Touch: drag your half</span>
  </div>
</div>

<script>
(() => {
  const W = 800, H = 600, PAD_W = 12, PAD_H = 72, BALL = 12, WIN = 11;
  const PAD_SPEED = 560, START_SPEED = 380, MAX_SPEED = 900;
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle'), ovSub = document.getElementById('ovSub');
  const PHOS = '#e8f1ff';

  let S; // game state
  function fresh(mode = 1) {
    return {
      mode, sound: S ? S.sound : true,
      left: { y: H/2 - PAD_H/2, score: 0 }, right: { y: H/2 - PAD_H/2, score: 0 },
      ball: { x: W/2, y: H/2, vx: 0, vy: 0 },
      phase: 'ready', // ready | play | paused | over
      serveDir: Math.random() < .5 ? -1 : 1,
      hits: 0,
    };
  }

  // ---------- sound: square-wave beeps like the original's sync generator tones
  let actx;
  function beep(freq, ms) {
    if (!S.sound) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square'; o.frequency.value = freq;
      g.gain.value = .06; o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + ms / 1000);
    } catch (e) {}
  }

  // ---------- input
  const keys = {};
  addEventListener('keydown', e => {
    if (['ArrowUp','ArrowDown',' '].includes(e.key)) e.preventDefault();
    keys[e.key.toLowerCase()] = true;
    if (e.key === ' ' || e.key === 'Enter') primary();
    if (e.key.toLowerCase() === 'p') togglePause();
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  const touches = { left: null, right: null };
  const screenEl = document.getElementById('screen');
  function toGame(t) {
    const r = cv.getBoundingClientRect();
    return { x: (t.clientX - r.left) / r.width * W, y: (t.clientY - r.top) / r.height * H };
  }
  function handleTouch(e) {
    e.preventDefault();
    touches.left = touches.right = null;
    for (const t of e.touches) {
      const p = toGame(t);
      if (p.x < W/2) touches.left = p.y; else touches.right = p.y;
    }
  }
  screenEl.addEventListener('touchstart', e => { handleTouch(e); if (S.phase !== 'play') primary(); }, { passive: false });
  screenEl.addEventListener('touchmove', handleTouch, { passive: false });
  screenEl.addEventListener('touchend', handleTouch, { passive: false });
  screenEl.addEventListener('mousedown', () => { if (S.phase !== 'play') primary(); });

  function setMode(m) {
    S = fresh(m);
    document.getElementById('m1').setAttribute('aria-pressed', m === 1);
    document.getElementById('m2').setAttribute('aria-pressed', m === 2);
    showOverlay();
  }
  document.getElementById('m1').onclick = e => { setMode(1); e.target.blur(); };
  document.getElementById('m2').onclick = e => { setMode(2); e.target.blur(); };
  const sndBtn = document.getElementById('snd');
  sndBtn.onclick = e => {
    S.sound = !S.sound; sndBtn.setAttribute('aria-pressed', S.sound);
    sndBtn.textContent = S.sound ? 'SOUND ON' : 'SOUND OFF'; e.target.blur();
  };

  function primary() {
    if (S.phase === 'ready') serve();
    else if (S.phase === 'paused') { S.phase = 'play'; showOverlay(); }
    else if (S.phase === 'play') togglePause();
    else if (S.phase === 'over') { S = fresh(S.mode); showOverlay(); }
  }
  function togglePause() {
    if (S.phase === 'play') S.phase = 'paused';
    else if (S.phase === 'paused') S.phase = 'play';
    showOverlay();
  }
  function serve() {
    const b = S.ball;
    b.x = W/2; b.y = H/2;
    const ang = (Math.random() * .6 - .3);
    b.vx = Math.cos(ang) * START_SPEED * S.serveDir;
    b.vy = Math.sin(ang) * START_SPEED;
    S.hits = 0; S.phase = 'play'; showOverlay();
  }

  function showOverlay() {
    const p = S.phase;
    overlay.hidden = p === 'play';
    ovSub.classList.toggle('blink', p !== 'paused');
    if (p === 'ready') {
      const fresh0 = S.left.score + S.right.score === 0;
      ovTitle.textContent = fresh0 ? (S.mode === 1 ? '1 PLAYER VS CPU' : '2 PLAYERS') : '';
      ovTitle.hidden = !fresh0;
      ovSub.textContent = 'PRESS SPACE OR TAP TO SERVE';
    } else if (p === 'paused') {
      ovTitle.hidden = false; ovTitle.textContent = 'PAUSED';
      ovSub.textContent = 'SPACE TO RESUME';
    } else if (p === 'over') {
      ovTitle.hidden = false;
      const lw = S.left.score > S.right.score;
      ovTitle.textContent = S.mode === 1 ? (lw ? 'YOU WIN' : 'CPU WINS') : (lw ? 'LEFT PLAYER WINS' : 'RIGHT PLAYER WINS');
      ovSub.textContent = 'SPACE OR TAP FOR NEW GAME';
    }
  }

  // ---------- update
  function movePaddle(p, dir, dt, touchY) {
    if (touchY != null) {
      const target = touchY - PAD_H/2;
      const d = target - p.y, step = PAD_SPEED * 1.6 * dt;
      p.y += Math.abs(d) < step ? d : Math.sign(d) * step;
    } else p.y += dir * PAD_SPEED * dt;
    p.y = Math.max(0, Math.min(H - PAD_H, p.y));
  }

  function cpu(dt) {
    const p = S.right, b = S.ball;
    // tracks the ball only when it heads its way, with a reaction lag and speed cap
    const target = b.vx > 0 ? b.y - PAD_H/2 + Math.sin(performance.now() / 400) * 18 : H/2 - PAD_H/2;
    const d = target - p.y, step = PAD_SPEED * .72 * dt;
    if (Math.abs(d) > 6) p.y += Math.sign(d) * Math.min(step, Math.abs(d));
    p.y = Math.max(0, Math.min(H - PAD_H, p.y));
  }

  function paddleHit(p, x, dir) {
    const b = S.ball;
    if (b.y + BALL < p.y || b.y > p.y + PAD_H) return false;
    // 8 segments like the original: edge hits deflect steeper
    const rel = ((b.y + BALL/2) - (p.y + PAD_H/2)) / (PAD_H/2);
    const ang = Math.max(-1, Math.min(1, rel)) * (Math.PI / 3.2);
    S.hits++;
    const speed = Math.min(MAX_SPEED, START_SPEED + S.hits * 28);
    b.vx = Math.cos(ang) * speed * dir;
    b.vy = Math.sin(ang) * speed;
    b.x = x;
    beep(480, 45);
    return true;
  }

  function point(side) {
    S[side].score++;
    beep(240, 260);
    S.serveDir = side === 'left' ? 1 : -1; // serve toward the player who lost the point
    if (S[side].score >= WIN) S.phase = 'over';
    else S.phase = 'ready';
    showOverlay();
  }

  function update(dt) {
    const up = k => keys[k] ? 1 : 0;
    movePaddle(S.left, up('s') - up('w') + (S.mode === 1 ? up('arrowdown') - up('arrowup') : 0), dt, touches.left ?? (S.mode === 1 ? touches.right : null));
    if (S.mode === 2) movePaddle(S.right, up('arrowdown') - up('arrowup'), dt, touches.right);
    else cpu(dt);

    if (S.phase !== 'play') return;
    const b = S.ball;
    // substeps keep fast balls from tunnelling through paddles
    const steps = Math.ceil(Math.hypot(b.vx, b.vy) * dt / 6);
    for (let i = 0; i < steps; i++) {
      const h = dt / steps;
      b.x += b.vx * h; b.y += b.vy * h;
      if (b.y < 0) { b.y = 0; b.vy = Math.abs(b.vy); beep(226, 30); }
      if (b.y > H - BALL) { b.y = H - BALL; b.vy = -Math.abs(b.vy); beep(226, 30); }
      const lx = 36, rx = W - 36 - PAD_W;
      if (b.vx < 0 && b.x <= lx + PAD_W && b.x >= lx - BALL) paddleHit(S.left, lx + PAD_W, 1);
      if (b.vx > 0 && b.x + BALL >= rx && b.x <= rx + PAD_W) paddleHit(S.right, rx - BALL, -1);
      if (b.x < -BALL) return point('right');
      if (b.x > W) return point('left');
    }
  }

  // ---------- draw: blocky segment digits like the 1972 board
  const DIGITS = ['1110111','0010010','1011101','1011011','0111010','1101011','1101111','1010010','1111111','1111011'];
  function drawDigit(d, x, y, s) {
    const seg = DIGITS[d], t = s, w = s * 4, h = s * 7;
    const r = (a, b, c, e) => ctx.fillRect(x + a, y + b, c, e);
    if (seg[0] === '1') r(0, 0, w, t);
    if (seg[1] === '1') r(0, 0, t, h/2 + t/2);
    if (seg[2] === '1') r(w - t, 0, t, h/2 + t/2);
    if (seg[3] === '1') r(0, h/2 - t/2, w, t);
    if (seg[4] === '1') r(0, h/2 - t/2, t, h/2 + t/2);
    if (seg[5] === '1') r(w - t, h/2 - t/2, t, h/2 + t/2);
    if (seg[6] === '1') r(0, h - t, w, t);
  }
  function drawScore(n, cx) {
    const s = 10, w = s * 4, gap = s * 2, str = String(n);
    const total = str.length * w + (str.length - 1) * gap;
    [...str].forEach((c, i) => drawDigit(+c, cx - total/2 + i * (w + gap), 34, s));
  }

  function draw() {
    ctx.fillStyle = '#05070a'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = PHOS;
    for (let y = 8; y < H; y += 30) ctx.fillRect(W/2 - 3, y, 6, 16);
    drawScore(S.left.score, W/4);
    drawScore(S.right.score, W * 3/4);
    ctx.fillRect(36, Math.round(S.left.y), PAD_W, PAD_H);
    ctx.fillRect(W - 36 - PAD_W, Math.round(S.right.y), PAD_W, PAD_H);
    if (S.phase === 'play' || S.phase === 'paused') ctx.fillRect(Math.round(S.ball.x), Math.round(S.ball.y), BALL, BALL);
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(.033, (now - last) / 1000); last = now;
    update(dt); draw();
    requestAnimationFrame(loop);
  }

  addEventListener('blur', () => { if (S.phase === 'play') togglePause(); });

  function start(data) {
    S = data && data.S ? data.S : fresh(1);
    document.getElementById('m1').setAttribute('aria-pressed', S.mode === 1);
    document.getElementById('m2').setAttribute('aria-pressed', S.mode === 2);
    showOverlay();
    requestAnimationFrame(loop);
  }
  window.claude?.hot?.snapshot?.(() => ({ S: { ...S, phase: S.phase === 'play' ? 'paused' : S.phase } }));
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
